# docker-compose.yml — come2gether-2026-challenge
#
# baramundi come2gether 2026 Challenge-Umgebung:
#   - bConnect Mock (simulierte bMS REST API)
#   - MCP Gateway (13 MCP-Server fuer KI-Agenten)
#   - n8n (Workflow-Automatisierung + baramundi Connector)
#
# Starten:
#   cp .env.example .env
#   docker-compose up -d
#   open http://localhost:5678   (Login: demo@c2g.local / Baramundi2026)
#
# Umschaltung Mock / Real bConnect: nur .env anpassen,
# dann: docker-compose down -v && docker-compose up -d

version: "2.4"

services:

  # ── bConnect Mock Server ──────────────────────────────────
  bconnect-mock:
    image: ${MOCK_IMAGE:-ghcr.io/baramundisoftware/bconnect-mock:0.3.2}
    container_name: c2g-mock
    ports:
      - "3433:3433"
    environment:
      PORT: "3433"
      BIND_ADDRESS: "0.0.0.0"
      BCONNECT_PROFILE: standard-readwrite
      BCONNECT_BMS_VERSION: 26r1
      RATE_LIMIT_ENABLED: "false"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:3433/health', r => process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - challenge-net

  # ── MCP Gateway (13 bConnect MCP-Server) ──────────────────
  mcp-gateway:
    image: ${GATEWAY_IMAGE:-ghcr.io/baramundisoftware/bconnect-mcp:latest}
    container_name: c2g-gateway
    ports:
      - "3001:3001"
    environment:
      MCP_GATEWAY_PORT: "3001"
      MCP_GATEWAY_BIND: "0.0.0.0"
      BCONNECT_BASE_URL: ${BCONNECT_BASE_URL:-http://bconnect-mock:3433/bconnect}
      BCONNECT_USERNAME: ${BCONNECT_USERNAME:-mockuser}
      BCONNECT_PASSWORD: ${BCONNECT_PASSWORD:-mockpass}
      BCONNECT_API_KEY: ${BCONNECT_API_KEY:-}
      BCONNECT_SKIP_CONNECTIVITY_CHECK: "true"
      BCONNECT_AUDIT_LEVEL: "none"
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
    depends_on:
      bconnect-mock:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:3001/health', r => process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - challenge-net

  # ── n8n + baramundi Connector ─────────────────────────────
  n8n:
    image: ${N8N_IMAGE:-ghcr.io/baramundisoftware/come2gether-2026-challenge:latest}
    container_name: c2g-n8n
    ports:
      - "5678:5678"
    environment:
      BCONNECT_BASE_URL: ${BCONNECT_BASE_URL:-http://bconnect-mock:3433/bconnect}
      BCONNECT_USERNAME: ${BCONNECT_USERNAME:-mockuser}
      BCONNECT_PASSWORD: ${BCONNECT_PASSWORD:-mockpass}
      BCONNECT_API_KEY: ${BCONNECT_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DISABLE_EMBEDDED_MOCK: "true"
      N8N_HOST: "0.0.0.0"
      N8N_PORT: "5678"
      N8N_DIAGNOSTICS_ENABLED: "false"
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
    depends_on:
      mcp-gateway:
        condition: service_healthy
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/seed/workflows:ro
      - ./scripts/seed-anthropic-credential.sh:/seed-anthropic-credential.sh:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    networks:
      - challenge-net

  # ── n8n Owner-Setup (einmalig beim ersten Start) ──────────
  n8n-init:
    image: curlimages/curl:latest
    container_name: c2g-init
    depends_on:
      n8n:
        condition: service_healthy
    volumes:
      - ./scripts/setup-owner.sh:/setup-owner.sh:ro
    entrypoint: ["sh", "/setup-owner.sh"]
    environment:
      N8N_URL: http://c2g-n8n:5678
      N8N_OWNER_EMAIL: ${N8N_OWNER_EMAIL:-demo@c2g.local}
      N8N_OWNER_PASSWORD: ${N8N_OWNER_PASSWORD:-Baramundi2026}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-opus-4-8}
    networks:
      - challenge-net

networks:
  challenge-net:
    driver: bridge

volumes:
  n8n_data:
